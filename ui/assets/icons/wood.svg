<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Wood/Lumber Icon -->
  <g id="wood-icon">
    <!-- Log -->
    <rect x="5" y="15" width="40" height="20" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <!-- Wood grain lines -->
    <line x1="5" y1="20" x2="45" y2="20" stroke="#654321" stroke-width="1"/>
    <line x1="5" y1="25" x2="45" y2="25" stroke="#654321" stroke-width="1"/>
    <line x1="5" y1="30" x2="45" y2="30" stroke="#654321" stroke-width="1"/>
    <!-- End circles -->
    <circle cx="5" cy="25" r="10" fill="#A0522D" stroke="#654321" stroke-width="2"/>
    <circle cx="45" cy="25" r="10" fill="#A0522D" stroke="#654321" stroke-width="2"/>
  </g>
</svg>